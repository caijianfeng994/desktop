<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>机器人制作详情</title>
  <style>
    :root { --bg:#09121c;--panel:#111d2a;--panel2:#172636;--line:#294055;--text:#eff6ff;--muted:#8fa4b9;--green:#47d7ad;--yellow:#f5b942;--blue:#4aa3f0;--red:#ff8585; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); font-family:"SF Pro Text","PingFang SC",sans-serif; background:radial-gradient(850px 480px at 90% 0,#183d5d 0,transparent 60%),var(--bg); }
    .shell { max-width:1100px; margin:auto; padding:24px 20px 60px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    a { color:var(--muted); text-decoration:none; }
    .brand { font-size:13px; letter-spacing:.13em; color:var(--muted); }
    .hero { display:flex; justify-content:space-between; align-items:flex-start; gap:22px; padding:24px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,var(--panel2),var(--panel)); }
    h1 { margin:0 0 10px; font-size:clamp(28px,5vw,45px); letter-spacing:-.04em; }
    .status { display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:6px 10px; font-size:13px; font-weight:750; }
    .status.pending { color:#ffd675;background:#3e3013; }.status.in_progress { color:#7ff0ce;background:#113c34; }
    .dot { width:7px;height:7px;border-radius:50%;background:currentColor; }
    .meta { color:var(--muted); line-height:1.7; }
    .open-robot { white-space:nowrap; border:1px solid var(--line); padding:9px 12px; border-radius:10px; }
    .claim { margin:16px 0; padding:18px 20px; display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:15px; background:var(--panel); }
    .claim-copy { flex:1; }.claim-copy strong { display:block;margin-bottom:4px; }.claim-copy span { color:var(--muted);font-size:13px; }
    input { min-width:190px; border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:#0b1520;color:var(--text);font:inherit; }
    button { border:0;border-radius:9px;padding:10px 15px;background:var(--green);color:#082019;font:inherit;font-weight:750;cursor:pointer; }
    button:disabled,input:disabled { opacity:.65;cursor:not-allowed; }
    .error { color:var(--red); min-height:1.2em; margin:0 0 14px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .panel { border:1px solid var(--line); border-radius:16px; background:var(--panel); padding:20px; }
    .panel h2 { margin:0 0 16px;font-size:19px; }.panel h3{margin:20px 0 10px;font-size:14px;color:#bad0e3;}
    .summary { display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px; }
    .metric { padding:11px;border-radius:10px;background:#172738; }.metric small { display:block;color:var(--muted);margin-bottom:5px; }.metric strong { font-size:17px; }
    .rows { display:grid;gap:8px; }.row { display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #213549; }.row:last-child{border-bottom:0}.row small{color:var(--muted);text-align:right}
    .skill { padding:12px;border:1px solid #22394e;border-radius:11px;background:#142334; }.skill strong{display:block;margin-bottom:4px}.skill p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .chips { display:flex;flex-wrap:wrap;gap:6px }.chip{padding:5px 8px;border:1px solid #2c4b61;border-radius:999px;color:#a9c7db;font-size:12px}
    @media(max-width:760px){.shell{padding:16px 13px 40px}.hero{display:block}.open-robot{display:inline-block;margin-top:16px}.claim{align-items:stretch;flex-direction:column}.claim input{width:100%}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
  </style>
  <link rel="stylesheet" href="/game-assets/legacy.css">
</head>
<body>
  <a class="workshop-return" href="/game#collection">← 返回小小工坊</a>
  <main class="shell">
    <header><div class="brand">DESKTOP ROBOT · BUILD DETAIL</div><a href="/publish.html">← 返回发布大厅</a></header>
    <div id="content"><div class="panel">正在加载制作详情…</div></div>
  </main>
  <script>
    const id=new URLSearchParams(location.search).get('id'),content=document.getElementById('content');
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const fmt=value=>{try{return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value))}catch(_){return value||''}};
    function render(item){const working=item.status==='in_progress',hardware=item.hardware||{},board=hardware.board||{},components=hardware.components||[],software=item.software||{},skills=software.skills||[],totals=hardware.totals||{};document.title=`${item.robot_name} · 制作详情`;content.innerHTML=`
      <section class="hero"><div><div class="status ${esc(item.status)}"><i class="dot"></i>${working?'制作中':'待制作'}</div><h1>${esc(item.robot_name)}</h1><div class="meta">发布于 ${esc(fmt(item.created_at))}${working?`<br>领取人：<strong>${esc(item.claimant_name)}</strong> · ${esc(fmt(item.claimed_at))}`:''}</div></div><a class="open-robot" href="/robot.html?id=${encodeURIComponent(item.robot_id)}">查看机器人 ↗</a></section>
      <section class="claim"><div class="claim-copy"><strong>${working?'该机器人已经进入制作':'领取这个制作任务'}</strong><span>${working?`当前由 ${esc(item.claimant_name)} 制作，发布大厅已同步更新。`:'填写姓名后，状态会从“待制作”变为“制作中”。'}</span></div><input id="claimant" maxlength="32" placeholder="领取人姓名" ${working?'disabled':''}><button id="claim" type="button" ${working?'disabled':''}>${working?'已领取':'确认领取'}</button></section><div class="error" id="error"></div>
      <div class="grid"><section class="panel"><h2>硬件信息</h2><div class="summary"><div class="metric"><small>主控</small><strong>${esc(board.name||'虚拟 Body')}</strong></div><div class="metric"><small>峰值功耗</small><strong>${totals.power_w??0}W</strong></div><div class="metric"><small>供电能力</small><strong>${totals.power_capacity_w??0}W</strong></div></div><h3>配件清单 · ${components.length}</h3><div class="rows">${components.length?components.map(entry=>{const part=entry.component||{};return `<div class="row"><span>${esc(part.name||part.id)}</span><small>${esc(entry.slot_id||'自由位置')} · ${part.power_w??0}W</small></div>`}).join(''):'<div class="meta">没有实体配件</div>'}</div><h3>硬件能力</h3><div class="chips">${(hardware.capabilities||[]).map(cap=>`<span class="chip">${esc(cap)}</span>`).join('')||'<span class="meta">无</span>'}</div></section>
      <section class="panel"><h2>软件功能</h2><div class="rows">${skills.length?skills.map(skill=>`<div class="skill"><strong>${esc(skill.name)}</strong><p>${esc(skill.summary)}</p><p>${esc(skill.effect_device)}</p></div>`).join(''):'<div class="meta">没有安装技能</div>'}</div>${software.custom_skill?`<h3>自定义技能</h3><div class="skill"><strong>${esc(software.custom_skill.name)}</strong><p>${esc(software.custom_skill.summary)}</p></div>`:''}</section></div>`;
      const claim=document.getElementById('claim');if(!working)claim.addEventListener('click',async()=>{const input=document.getElementById('claimant'),error=document.getElementById('error'),name=input.value.trim();error.textContent='';if(!name){error.textContent='请填写领取人姓名';input.focus();return}claim.disabled=true;claim.textContent='领取中…';try{const response=await fetch(`/api/publications/${encodeURIComponent(item.publication_id)}/claim`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({claimant_name:name})}),data=await response.json();if(!data.ok){error.textContent=data.reason||'领取失败';claim.disabled=false;claim.textContent='确认领取';return}render(data.publication)}catch(_){error.textContent='领取失败，请稍后重试';claim.disabled=false;claim.textContent='确认领取'}});
    }
    async function load(){if(!id){content.innerHTML='<div class="panel">缺少发布单编号</div>';return}try{const response=await fetch(`/api/publications/${encodeURIComponent(id)}`,{cache:'no-store'}),data=await response.json();if(!data.ok)throw new Error(data.reason||'加载失败');render(data.publication)}catch(error){content.innerHTML=`<div class="panel">${esc(error.message||'加载失败')}</div>`}}
    load();
  </script>
</body>
</html>
