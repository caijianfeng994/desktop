[project]
name = "desktop-robot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agent = [
  "deepagents>=0.7",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
]
design = [
  "cadgen[snapshot]==0.5.1",
  "trimesh",
  "numpy",
  "rtree",
  "scipy",
  "networkx",
  "lxml",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"desktop_robot.studio" = ["static/*", "static/game/*", "static/vendor/three/*.js", "static/vendor/three/controls/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
